<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0f6f5">
<title>心不全療養指導士 練習問題</title>
<style>
:root { font-family: system-ui, "Yu Gothic", sans-serif; color: #172f35; background: #f0f6f5; line-height: 1.65; }
* { box-sizing: border-box; }
body { margin: 0; }
header { background: #103b42; color: white; padding: 1.2rem max(1rem, calc((100% - 42rem) / 2)); }
header h1 { font-size: clamp(1.2rem, 4.8vw, 1.65rem); margin: 0; }
main { width: min(100% - 2rem, 42rem); margin: 2rem auto; }
section { background: white; border: 1px solid #d2e1df; border-radius: 18px; padding: clamp(1rem, 4vw, 2rem); box-shadow: 0 8px 28px #133b4210; }
h2 { margin: 0 0 1rem; font-size: 1.3rem; line-height: 1.5; }
button { font: inherit; cursor: pointer; min-height: 48px; border-radius: 10px; padding: .7rem 1rem; }
button:focus-visible, input:focus-visible { outline: 3px solid #116a91; outline-offset: 3px; }
.primary { width: 100%; border: 1px solid #12665e; background: #12665e; color: white; font-weight: 700; }
.primary:disabled { background: #e9efee; color: #455e61; border-color: #d7e2df; cursor: default; }
.secondary { border: 1px solid #a1bfbd; color: #124e4a; background: white; width: 100%; text-align: left; }
.modes { display: grid; gap: .7rem; }
.meta { margin: 0 0 .55rem; font-size: .9rem; color: #48656a; font-weight: 650; }
progress { display: block; width: 100%; height: .55rem; margin-bottom: 1.25rem; accent-color: #12665e; }
.prompt { white-space: pre-line; font-size: 1.1rem; }
fieldset { margin: 0 0 1rem; padding: 0; border: 0; display: grid; gap: .65rem; }
.option { display: flex; align-items: center; gap: .7rem; min-height: 54px; padding: .75rem; border: 1px solid #bacdcd; border-radius: 10px; cursor: pointer; }
.option:has(input:checked) { background: #e4f2ef; border-color: #12665e; }
.option input { flex: none; width: 1.1rem; height: 1.1rem; margin: 0; accent-color: #12665e; }
.feedback { padding: 1rem; margin-bottom: 1rem; border-radius: 10px; background: #eaf4ef; border-inline-start: 4px solid #12665e; }
.feedback.wrong { background: #fff3e8; border-color: #a14d17; }
.feedback p { margin: .5rem 0 0; }
[hidden] { display: none !important; }
</style>
<script defer src="questions.js"></script>
<script defer src="quiz.js"></script>
</head>
<body>
<header><h1>心不全療養指導士 練習問題</h1></header>
<main>
<section id="home">
<h2 tabindex="-1" id="home-heading">出題方法を選ぶ</h2>
<div class="modes" id="modes"></div>
</section>
<section id="quiz" hidden>
<p class="meta" id="position"></p>
<progress id="progress" aria-label="出題の進み具合"></progress>
<h2 id="prompt" class="prompt" tabindex="-1"></h2>
<form id="answer-form">
<fieldset id="choices" aria-label="解答の選択肢"></fieldset>
<button id="submit" type="submit" class="primary" disabled>解答する</button>
</form>
<div id="feedback" class="feedback" tabindex="-1" hidden>
<strong id="result"></strong>
<p id="correct"></p>
<p id="explanation"></p>
<p id="reference" class="meta"></p>
</div>
<button id="next" type="button" class="primary" hidden>次の問題</button>
</section>
</main>
</body>
</html>
